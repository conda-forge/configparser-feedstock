{% set version = "7.3.0" %}

package:
  name: configparser
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/configparser/configparser-{{ version }}.tar.gz
  sha256: 2e148379c75806e4ab879bea6245774c65b6206236f4b3d74d8231cb1c46c741

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
    - setuptools_scm >=3.4.1
    - toml
  run:
    - python >={{ python_min }}

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - backports
    - backports.configparser
    - configparser
  commands:
    - pip check

about:
  home: http://docs.python.org/3/library/configparser.html
  license: MIT
  license_file: LICENSE
  summary: Updated configparser from Python 3.8 for Python 2.6+.

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
    - bgruening
